<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星光记事本 | Markdown编辑器</title>    
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.10.4/font/bootstrap-icons.css" rel="stylesheet">
    <meta name="description" content="星光工作室Markdown编辑器，支持实时预览、文件操作和图片导出">
    <meta name="keywords" content="Markdown编辑器,Typora,文件操作,图片导出,在线编辑">
    <style>
        :root {
            --editor-bg: #ffffff;
            --preview-bg: #f7f6f3;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --toolbar-bg: #f5f5f5;
            --hover-color: #e9e9e9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #app-title {
            background-color: #2d3748;
            color: white;
            padding: 12px 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        #toolbar {
            height: 60px;
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .toolbar-btn {
            background: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #555;
            transition: all 0.2s;
            position: relative;
        }

        .toolbar-btn:hover {
            background-color: var(--hover-color);
        }

        .toolbar-btn .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            margin-bottom: 5px;
            pointer-events: none;
        }

        .toolbar-btn:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        .toolbar-separator {
            width: 1px;
            height: 24px;
            background-color: var(--border-color);
            margin: 0 4px;
        }

        #file-operations {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #4299e1;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
        }

        .file-btn:hover {
            background-color: #3182ce;
        }

        .file-btn.secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .file-btn.secondary:hover {
            background-color: #cbd5e0;
        }

        #mode-selector {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-left: 10px;
        }

        .mode-btn {
            padding: 6px 12px;
            background-color: white;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .mode-btn.active {
            background-color: #007bff;
            color: white;
        }

        #content-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #editor {
            width: 50%;
            height: 100%;
            border: none;
            resize: none;
            padding: 20px;
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
            font-size: 16px;
            line-height: 1.6;
            box-sizing: border-box;
            background-color: var(--editor-bg);
            transition: width 0.3s ease;
        }

        #preview {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            background-color: var(--preview-bg);
            border-left: 1px solid var(--border-color);
            transition: width 0.3s ease;
        }

        #editor:focus {
            outline: none;
        }

        /* 预览区样式 */
        #preview h1, #preview h2, #preview h3, 
        #preview h4, #preview h5, #preview h6 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: #2d3748;
        }

        #preview h1 {
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }

        #preview p {
            margin: 1em 0;
            line-height: 1.8;
        }

        #preview ul, #preview ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        #preview ul {
            list-style-type: disc;
        }

        #preview ol {
            list-style-type: decimal;
        }

        #preview pre {
            background-color: #2d3748;
            color: #e2e8f0;
            padding: 1em;
            border-radius: 4px;
            overflow-x: auto;
            margin: 1em 0;
        }

        #preview code {
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
            font-size: 0.9em;
        }

        #preview blockquote {
            border-left: 4px solid #cbd5e0;
            padding-left: 1em;
            margin: 1em 0;
            color: #4a5568;
        }

        #preview img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 1em 0;
        }

        #preview table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }

        #preview th, #preview td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
        }

        #preview th {
            background-color: #f7fafc;
            font-weight: 600;
        }

        #preview a {
            color: #3182ce;
            text-decoration: none;
        }

        #preview a:hover {
            text-decoration: underline;
        }

        /* 模式切换样式 */
        .mode-edit #editor {
            width: 100%;
        }
        
        .mode-edit #preview {
            width: 0%;
            display: none;
        }
        
        .mode-preview #editor {
            width: 0%;
            display: none;
        }
        
        .mode-preview #preview {
            width: 100%;
        }

        /* 隐藏文件输入 */
        #file-input {
            display: none;
        }

        /* 状态提示 */
        #status-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(45, 55, 72, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #status-indicator.show {
            opacity: 1;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            #toolbar {
                height: auto;
                padding: 8px 10px;
            }
            
            .file-btn span {
                display: none;
            }
            
            .file-btn {
                padding: 6px;
            }
            
            .mode-btn {
                padding: 6px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="app-title">
        <i class="bi bi-markdown"></i> 星光记事本 | Markdown编辑器
    </div>

    <div id="toolbar">
        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="heading">
                <i class="bi bi-type-h1"></i>
                <span class="tooltip">标题 (Ctrl+H)</span>
            </button>
            <button class="toolbar-btn" data-command="bold">
                <i class="bi bi-type-bold"></i>
                <span class="tooltip">粗体 (Ctrl+B)</span>
            </button>
            <button class="toolbar-btn" data-command="italic">
                <i class="bi bi-type-italic"></i>
                <span class="tooltip">斜体 (Ctrl+I)</span>
            </button>
            <button class="toolbar-btn" data-command="link">
                <i class="bi bi-link"></i>
                <span class="tooltip">链接 (Ctrl+L)</span>
            </button>
            <button class="toolbar-btn" data-command="image">
                <i class="bi bi-image"></i>
                <span class="tooltip">图片 (Ctrl+P)</span>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <div class="toolbar-group">
            <button class="toolbar-btn" data-command="list">
                <i class="bi bi-list-ul"></i>
                <span class="tooltip">无序列表</span>
            </button>
            <button class="toolbar-btn" data-command="ordered-list">
                <i class="bi bi-list-ol"></i>
                <span class="tooltip">有序列表</span>
            </button>
            <button class="toolbar-btn" data-command="code">
                <i class="bi bi-code"></i>
                <span class="tooltip">代码块</span>
            </button>
            <button class="toolbar-btn" data-command="quote">
                <i class="bi bi-blockquote-left"></i>
                <span class="tooltip">引用</span>
            </button>
        </div>

        <div class="toolbar-separator"></div>

        <div id="file-operations">
            <label for="file-input" class="file-btn secondary">
                <i class="bi bi-folder-open"></i>
                <span>打开文件</span>
            </label>
            <input type="file" id="file-input" accept=".md,.markdown">
            
            <button class="file-btn secondary" id="export-md">
                <i class="bi bi-file-earmark-text"></i>
                <span>导出MD</span>
            </button>
            
            <button class="file-btn" id="export-image">
                <i class="bi bi-file-earmark-image"></i>
                <span>导出图片</span>
            </button>
            
            <button class="toolbar-btn" data-command="clear">
                <i class="bi bi-trash"></i>
                <span class="tooltip">清空</span>
            </button>
            
            <div id="mode-selector">
                <button class="mode-btn active" data-mode="split">分屏</button>
                <button class="mode-btn" data-mode="edit">仅编辑</button>
                <button class="mode-btn" data-mode="preview">仅预览</button>
            </div>
        </div>
    </div>

    <div id="content-container" class="mode-split">
        <textarea id="editor" placeholder="在此输入Markdown内容..."></textarea>
        <div id="preview"></div>
    </div>

    <div id="status-indicator"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const editor = document.getElementById('editor');
            const preview = document.getElementById('preview');
            const contentContainer = document.getElementById('content-container');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const toolbarBtns = document.querySelectorAll('.toolbar-btn[data-command]');
            const fileInput = document.getElementById('file-input');
            const exportMdBtn = document.getElementById('export-md');
            const exportImageBtn = document.getElementById('export-image');
            const statusIndicator = document.getElementById('status-indicator');

            // 显示状态提示
            function showStatus(message, duration = 2000) {
                statusIndicator.textContent = message;
                statusIndicator.classList.add('show');
                
                setTimeout(() => {
                    statusIndicator.classList.remove('show');
                }, duration);
            }

            // 初始内容
            editor.value = `# 欢迎使用星光记事本

这是一个增强版Markdown编辑器，支持：

- 实时预览Markdown效果
- 打开本地Markdown文件
- 导出为Markdown文件
- 导出为图片
- 三种编辑模式切换

## 使用指南

1. 使用顶部工具栏可以快速添加格式化内容
2. 右侧文件操作区可以进行文件的打开和导出
3. 可以通过模式切换按钮选择分屏、仅编辑或仅预览模式

## 格式示例

**粗体文本**

*斜体文本*

[链接示例](https://example.com)

![图片示例](https://picsum.photos/800/400)

> 这是一段引用文本

\`\`\`javascript
// 代码块示例
function greet() {
    console.log("Hello, Markdown!");
}
\`\`\`

- 无序列表项1
- 无序列表项2
`;

            // 更新预览
            function updatePreview() {
                preview.innerHTML = marked.parse(editor.value);
            }

            // 初始更新预览
            updatePreview();

            // 实时更新预览
            editor.addEventListener('input', updatePreview);

            // 模式切换
            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // 移除所有活跃状态
                    modeBtns.forEach(b => b.classList.remove('active'));
                    // 添加当前按钮活跃状态
                    this.classList.add('active');
                    
                    // 移除所有模式类
                    contentContainer.classList.remove('mode-split', 'mode-edit', 'mode-preview');
                    // 添加当前模式类
                    const mode = this.getAttribute('data-mode');
                    contentContainer.classList.add(`mode-${mode}`);
                    
                    editor.focus();
                });
            });

            // 工具栏按钮功能
            toolbarBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const command = this.getAttribute('data-command');
                    handleCommand(command);
                    editor.focus();
                });
            });

            // 处理命令
            function handleCommand(command) {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const selectedText = editor.value.substring(start, end);
                let newText, newCursorPos;

                switch(command) {
                    case 'heading':
                        newText = selectedText ? `# ${selectedText}` : '# 标题';
                        newCursorPos = start + (selectedText ? 3 : 3);
                        break;
                    case 'bold':
                        newText = selectedText ? `**${selectedText}**` : '**粗体文本**';
                        newCursorPos = start + (selectedText ? 2 : 2);
                        break;
                    case 'italic':
                        newText = selectedText ? `*${selectedText}*` : '*斜体文本*';
                        newCursorPos = start + (selectedText ? 1 : 1);
                        break;
                    case 'link':
                        newText = selectedText ? `[${selectedText}](链接地址)` : '[链接文本](链接地址)';
                        newCursorPos = start + (selectedText ? selectedText.length + 3 : 4);
                        break;
                    case 'image':
                        newText = selectedText ? `![${selectedText}](图片地址)` : '![图片描述](图片地址)';
                        newCursorPos = start + (selectedText ? selectedText.length + 4 : 5);
                        break;
                    case 'list':
                        newText = selectedText ? `- ${selectedText}` : '- 列表项';
                        newCursorPos = start + (selectedText ? 3 : 3);
                        break;
                    case 'ordered-list':
                        newText = selectedText ? `1. ${selectedText}` : '1. 列表项';
                        newCursorPos = start + (selectedText ? 4 : 4);
                        break;
                    case 'code':
                        newText = selectedText ? '```\n' + selectedText + '\n```' : '```\n代码块\n```';
                        newCursorPos = start + (selectedText ? 4 : 4);
                        break;
                    case 'quote':
                        newText = selectedText ? `> ${selectedText}` : '> 引用文本';
                        newCursorPos = start + (selectedText ? 3 : 3);
                        break;
                    case 'clear':
                        if (confirm('确定要清空内容吗？')) {
                            editor.value = '';
                            updatePreview();
                            showStatus('内容已清空');
                        }
                        return;
                }

                // 替换选中的文本
                editor.value = editor.value.substring(0, start) + newText + editor.value.substring(end);
                // 更新预览
                updatePreview();
                // 设置光标位置
                editor.selectionStart = newCursorPos;
                editor.selectionEnd = newCursorPos;
            }

            // 打开文件功能
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                // 检查文件类型
                if (!file.name.endsWith('.md') && !file.name.endsWith('.markdown')) {
                    showStatus('请选择Markdown文件 (.md 或 .markdown)');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    editor.value = e.target.result;
                    updatePreview();
                    showStatus(`已打开文件: ${file.name}`);
                };
                reader.readAsText(file);

                // 重置文件输入，允许重复选择同一文件
                fileInput.value = '';
            });

            // 导出为MD文件
            exportMdBtn.addEventListener('click', function() {
                if (!editor.value.trim()) {
                    showStatus('内容为空，无法导出');
                    return;
                }

                const blob = new Blob([editor.value], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'document.md';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('已导出为Markdown文件');
            });

            // 导出为图片
            exportImageBtn.addEventListener('click', function() {
                if (!editor.value.trim()) {
                    showStatus('内容为空，无法导出图片');
                    return;
                }

                showStatus('正在生成图片...');
                
                // 创建一个临时容器用于截图
                const tempContainer = document.createElement('div');
                tempContainer.style.position = 'absolute';
                tempContainer.style.top = '-9999px';
                tempContainer.style.left = '-9999px';
                tempContainer.style.width = '800px';
                tempContainer.style.padding = '40px';
                tempContainer.style.backgroundColor = 'white';
                tempContainer.innerHTML = preview.innerHTML;
                document.body.appendChild(tempContainer);

                // 使用html2canvas截图
                html2canvas(tempContainer, {
                    scale: 2, // 提高分辨率
                    useCORS: true, // 允许跨域图片
                    logging: false
                }).then(canvas => {
                    // 移除临时容器
                    document.body.removeChild(tempContainer);
                    
                    // 下载图片
                    const link = document.createElement('a');
                    link.download = 'document.png';
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    showStatus('已导出为图片');
                }).catch(error => {
                    document.body.removeChild(tempContainer);
                    showStatus('导出图片失败: ' + error.message);
                    console.error('截图失败:', error);
                });
            });

            // 快捷键支持
            document.addEventListener('keydown', function(e) {
                // Ctrl+B 粗体
                if (e.ctrlKey && e.key === 'b') {
                    e.preventDefault();
                    handleCommand('bold');
                }
                // Ctrl+I 斜体
                if (e.ctrlKey && e.key === 'i') {
                    e.preventDefault();
                    handleCommand('italic');
                }
                // Ctrl+L 链接
                if (e.ctrlKey && e.key === 'l') {
                    e.preventDefault();
                    handleCommand('link');
                }
                // Ctrl+H 标题
                if (e.ctrlKey && e.key === 'h') {
                    e.preventDefault();
                    handleCommand('heading');
                }
                // Ctrl+P 图片
                if (e.ctrlKey && e.key === 'p') {
                    e.preventDefault();
                    handleCommand('image');
                }
            });

            // 初始状态提示
            setTimeout(() => {
                showStatus('编辑器已准备就绪', 3000);
            }, 500);
        });
    </script>
</body>
</html>
